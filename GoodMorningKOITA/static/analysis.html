<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoodMorningKOITA DB 분석</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2457d6">
<link rel="icon" href="/icons/icon-192.png">
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6b7280; --line: #e3e6eb;
    --accent: #2457d6; --accent-soft: #e8eefc;
    --online: #2457d6; --print: #d97706; --broadcast: #15803d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 24px;
           display: flex; align-items: center; gap: 12px; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 18px; margin: 0 8px 0 0; }
  button, input, select { font: inherit; }
  select, input[type=date] { border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: #fff; }
  button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--muted); }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 24px; display: grid; gap: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .panel h2 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: baseline; gap: 8px; }
  .panel h2 small { font-weight: 400; color: var(--muted); font-size: 12px; }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .cards.three { grid-template-columns: repeat(3, 1fr); }
  .unlinked-note { color: var(--muted); font-size: 12px; margin: -4px 0 12px; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; background: var(--panel); }
  .card .label { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .card .num { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .card .num small { font-size: 14px; font-weight: 400; color: var(--muted); margin-left: 2px; }
  .card .pct { color: var(--muted); font-size: 12px; }
  .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .dot.online { background: var(--online); } .dot.print { background: var(--print); } .dot.broadcast { background: var(--broadcast); }
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); font-weight: 400; margin-left: auto; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap;
           font-variant-numeric: tabular-nums; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  th:first-child, td:first-child { text-align: left; }
  td.bar-cell { width: 45%; text-align: left; }
  .bar { display: flex; height: 14px; border-radius: 3px; overflow: hidden; background: #f1f2f4; }
  .bar span { display: block; height: 100%; }
  .bar .online { background: var(--online); } .bar .print { background: var(--print); } .bar .broadcast { background: var(--broadcast); }
  tr.zero td { color: #b6bcc6; }
  #by-release td:first-child { white-space: normal; min-width: 240px; }
  #sp-list td.t { white-space: normal; text-align: left; min-width: 240px; }
  #sp-list td.l { text-align: left; }
  .sub-badge { display: inline-block; font-size: 12px; border-radius: 4px; padding: 0 8px; font-weight: 600; }
  .sub-badge.기고 { background: #ede9fe; color: #6d28d9; }
  .sub-badge.인터뷰 { background: #e0f2fe; color: #0369a1; }
  .sub-badge.기획보도 { background: #fef3c7; color: #b45309; }
  .scroll { max-height: 480px; overflow: auto; }
  .scroll thead th { position: sticky; top: 0; background: var(--panel); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .empty { color: var(--muted); padding: 16px; text-align: center; }
  .error { background: #fee2e2; color: #b91c1c; border-radius: 6px; padding: 8px 12px; }
  @media (max-width: 860px) {
    .two { grid-template-columns: 1fr; }
    .cards, .cards.three { grid-template-columns: repeat(2, 1fr); }
    header, main { padding: 12px 16px; }
    td.bar-cell { width: 35%; }
  }
</style>
</head>
<body>
<header>
  <h1>📊 기사 DB 분석 <small id="version" style="font-size:12px; color:var(--muted); font-weight:400"></small></h1>
  <div class="row">
    <select id="preset" title="분석할 기간 (DB의 '날짜' 열 기준)">
      <option value="all">전체 기간</option>
      <option value="this-year" selected>올해</option>
      <option value="last-year">작년</option>
      <option value="this-month">이번 달</option>
      <option value="12m">최근 12개월</option>
      <option value="range">날짜 지정</option>
    </select>
    <input type="date" id="date-from"> ~ <input type="date" id="date-to">
    <button id="btn-refresh" title="DB를 다시 읽어 분석">새로 고침</button>
  </div>
  <span class="muted" id="period-info"></span>
</header>

<main>
  <div id="error"></div>
  <section class="cards" id="cards"></section>

  <section class="panel">
    <h2>년도별 <small>DB 행 수 기준</small><span class="legend" data-legend></span></h2>
    <div id="by-year"></div>
  </section>

  <section class="panel">
    <h2>월별<span class="legend" data-legend></span></h2>
    <div id="by-month" class="scroll"></div>
  </section>

  <div class="two">
    <section class="panel">
      <h2>분류별<span class="legend" data-legend></span></h2>
      <div id="by-category" class="scroll"></div>
    </section>
    <section class="panel">
      <h2>언론사별 <small id="press-count"></small><span class="legend" data-legend></span></h2>
      <div id="by-press" class="scroll"></div>
    </section>
  </div>

  <section class="panel">
    <h2>보도자료별 <small id="pr-info"></small><span class="legend" data-legend></span>
      <a href="/pressrelease" target="_blank" style="font-size:12px; font-weight:400; margin-left:8px">보도자료 창에서 연결하기 ↗</a></h2>
    <div class="row" style="margin-bottom:12px">
      <button id="btn-xlsx-summary" title="보도자료 목록과 보도자료별 보도건수(총·온라인·지면·방송)">📥 보도자료 목록·보도건수 엑셀</button>
      <button id="btn-xlsx-articles" title="보도자료마다 연결된 기사 전체 (날짜·언론사·제목·URL)">📥 보도자료별 연결 기사 엑셀</button>
      <span class="muted" style="font-size:12px">위 기간(배포일 기준)의 보도자료</span>
    </div>
    <div class="cards three" id="pr-cards" style="margin-bottom:12px"></div>
    <div class="unlinked-note" id="pr-unlinked"></div>
    <div id="by-release" class="scroll"></div>
  </section>

  <section class="panel">
    <h2>특별보도 <small id="sp-info"></small>
      <a href="/special" target="_blank" style="font-size:12px; font-weight:400; margin-left:auto">특별보도 창에서 묶기 ↗</a></h2>
    <div class="row" style="margin-bottom:12px">
      <button id="btn-xlsx-special-summary" title="특별보도 목록 + 구분별 건수 (옆 '구분' 골라 보기를 따름)">📥 특별보도 목록 엑셀</button>
      <button id="btn-xlsx-special" title="특별보도 목록 + 묶인 기사 전체 + 구분별 건수 (옆 '구분' 골라 보기를 따름)">📥 특별보도 목록·연결 기사 엑셀</button>
      <select id="sp-filter" title="구분으로 골라 보기"><option value="">구분 전체</option></select>
    </div>
    <div class="cards" id="sp-cards" style="margin-bottom:12px"></div>
    <div class="unlinked-note" id="sp-unassigned"></div>
    <div id="sp-list" class="scroll"></div>
  </section>

  <p class="muted" style="font-size:12px; margin:0">건수는 DB 행 수 기준입니다. 같은 기사가 온라인과 지면(또는 방송)으로 모두 있으면 각각 1건으로 셉니다. 기간은 DB의 '날짜' 열 기준입니다.</p>
</main>

<script>
const $ = (id) => document.getElementById(id);
const KINDS = [["online", "온라인"], ["print", "지면"], ["broadcast", "방송"]];

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
const fmt = (n) => Number(n).toLocaleString("ko-KR");
const iso = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);

async function api(path) {
  const res = await fetch(path);
  if (res.status === 401) { location.href = "/login"; throw new Error("로그인이 필요합니다."); }
  if (!res.ok) throw new Error(await res.json().then(j => j.detail).catch(() => res.statusText));
  return res.json();
}

// 미리 정한 기간 → 날짜 칸
function applyPreset() {
  const p = $("preset").value;
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const set = (from, to) => { $("date-from").value = from; $("date-to").value = to; };
  if (p === "all") set("", "");
  else if (p === "this-year") set(`${y}-01-01`, `${y}-12-31`);
  else if (p === "last-year") set(`${y - 1}-01-01`, `${y - 1}-12-31`);
  else if (p === "this-month") set(iso(new Date(y, m, 1)), iso(new Date(y, m + 1, 0)));
  else if (p === "12m") set(iso(new Date(y, m - 11, 1)), iso(new Date(y, m + 1, 0)));
}

// 보도자료 엑셀 내려받기. what: summary(보도자료 목록+보도건수) / articles(보도자료에 연결된 기사 전체)
async function downloadReleaseXlsx(what, body, button) {
  if (button) button.disabled = true;
  try {
    const res = await fetch(`/api/press-releases/export/${what}`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (res.status === 401) { location.href = "/login"; return; }
    if (!res.ok) throw new Error(await res.json().then(j => j.detail).catch(() => res.statusText));
    const cd = res.headers.get("Content-Disposition") || "";
    const name = decodeURIComponent((cd.match(/filename\*=UTF-8''([^;]+)/) || [])[1] || `${what}.xlsx`);
    const url = URL.createObjectURL(await res.blob());
    const a = Object.assign(document.createElement("a"), { href: url, download: name });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } catch (err) {
    alert(`엑셀을 만들지 못했습니다: ${err.message}`);
  } finally {
    if (button) button.disabled = false;
  }
}

function bar(item, max) {
  if (!max) return `<div class="bar"></div>`;
  return `<div class="bar" title="온라인 ${item.online} · 지면 ${item.print} · 방송 ${item.broadcast}">` +
    KINDS.map(([k]) => item[k] ? `<span class="${k}" style="width:${item[k] / max * 100}%"></span>` : "").join("") + `</div>`;
}

function table(items, label, emptyText) {
  if (!items.length) return `<div class="empty">${emptyText}</div>`;
  const max = Math.max(...items.map(x => x.total));
  return `<table><thead><tr><th>${label}</th><th>총</th><th>온라인</th><th>지면</th><th>방송</th><th></th></tr></thead><tbody>` +
    items.map(x => `<tr class="${x.total ? "" : "zero"}"><td>${esc(x.label ?? x.key)}</td><td><b>${fmt(x.total)}</b></td>
      <td>${fmt(x.online)}</td><td>${fmt(x.print)}</td><td>${fmt(x.broadcast)}</td><td class="bar-cell">${bar(x, max)}</td></tr>`).join("") +
    `</tbody></table>`;
}

// 기간 안의 모든 달을 0건 포함해 채운다 (빈 달도 보이게)
function fillMonths(list, from, to) {
  if (!from || !to) return list;
  const have = new Map(list.map(x => [x.key, x]));
  const out = [];
  let [y, m] = from.slice(0, 7).split("-").map(Number);
  const end = to.slice(0, 7);
  for (let guard = 0; guard < 600; guard++) {
    const key = `${y}-${String(m).padStart(2, "0")}`;
    if (key > end) break;
    out.push(have.get(key) || { key, total: 0, online: 0, print: 0, broadcast: 0 });
    if (++m > 12) { m = 1; y++; }
  }
  return out;
}

// 보도자료별 기사 건수 (기간은 보도자료 배포일 기준)
function renderReleases(pr) {
  if (!pr) { $("by-release").innerHTML = ""; return; }
  const m = pr.summary;
  $("pr-info").textContent = `배포일 기준 · 보도자료 ${fmt(m.releases)}건` + (pr.folder_error ? " · 보도자료 폴더를 못 읽어 연결해 둔 보도자료만" : "");
  const card = (label, num, sub) => `<div class="card"><div class="label">${label}</div><div class="num">${num}<small>건</small></div><div class="pct">${sub || "&nbsp;"}</div></div>`;
  $("pr-cards").innerHTML = card("보도자료", fmt(m.releases), `기사 0건 ${fmt(m.releases_without_articles)}`) +
    card("보도자료 기반 언론보도", fmt(m.linked.total), `온라인 ${fmt(m.linked.online)} · 지면 ${fmt(m.linked.print)} · 방송 ${fmt(m.linked.broadcast)}`) +
    card("보도자료 1건당 평균 보도건수", m.average);
  // 미연결 기사는 카드 대신 작은 안내 (있을 때만, 기사 날짜가 이 기간인 것)
  $("pr-unlinked").textContent = m.unlinked ? `*DB에서 연결되지 않은 [보도자료] 기사가 ${fmt(m.unlinked)}건 있습니다.` : "";
  const items = [...pr.by_release].sort((a, b) => b.total - a.total || (a.date < b.date ? 1 : -1))
    .map(x => ({ ...x, label: `${x.date} ${x.title}` }));
  $("by-release").innerHTML = table(items, "보도자료 (배포일 · 보도자료명)", "이 기간에 배포한 보도자료가 없습니다.");
}

// 특별보도: 묶음 1개 = 1건. 기고·인터뷰·기획보도 건수와 목록
let special = null;
function renderSpecial(sp) {
  special = sp || special;
  if (!special) { $("sp-list").innerHTML = ""; return; }
  const m = special.summary;
  if (!$("sp-filter").options[1]) $("sp-filter").insertAdjacentHTML("beforeend", special.subtypes.map(t => `<option>${esc(t)}</option>`).join(""));
  $("sp-info").textContent = `묶음 1개 = 1건 · 특별보도 날짜(지면 기사 날짜, 없으면 첫 기사 날짜) 기준`;
  const card = (label, num, sub) => `<div class="card"><div class="label">${label}</div><div class="num">${num}<small>건</small></div><div class="pct">${sub}</div></div>`;
  $("sp-cards").innerHTML = card("특별보도", fmt(m.total), `기사 ${fmt(m.rows.total)}행 (온라인 ${fmt(m.rows.online)} · 지면 ${fmt(m.rows.print)} · 방송 ${fmt(m.rows.broadcast)})`) +
    special.subtypes.map(t => card(`<span class="sub-badge ${esc(t)}">${esc(t)}</span>`, fmt(m.by_subtype[t].count), `기사 ${fmt(m.by_subtype[t].rows.total)}행`)).join("");
  $("sp-unassigned").textContent = m.unassigned ? `*아직 특별보도로 묶지 않은 [특별보도] 기사가 ${fmt(m.unassigned)}건 있습니다.` : "";
  const f = $("sp-filter").value;
  const list = special.groups.filter(g => !f || g.subtype === f);
  $("sp-list").innerHTML = list.length ? `<table><thead><tr><th>날짜</th><th style="text-align:left">구분</th><th style="text-align:left">언론사</th>
    <th style="text-align:left">특별보도명</th><th>기사 행</th><th>온라인</th><th>지면</th><th>방송</th></tr></thead><tbody>` +
    list.map(g => `<tr><td>${esc(g.date)}</td><td class="l"><span class="sub-badge ${esc(g.subtype)}">${esc(g.subtype)}</span></td>
      <td class="l">${esc(g.press)}</td><td class="t">${esc(g.title)}</td><td><b>${g.total}</b></td><td>${g.online}</td><td>${g.print}</td><td>${g.broadcast}</td></tr>`).join("") +
    `</tbody></table>` : `<div class="empty">이 기간에 등록한 특별보도가 없습니다.</div>`;
}

async function load() {
  const q = new URLSearchParams();
  if ($("date-from").value) q.set("date_from", $("date-from").value);
  if ($("date-to").value) q.set("date_to", $("date-to").value);
  try {
    const s = await api(`/api/archive/stats?${q}`);
    $("error").innerHTML = "";
    const t = s.totals;
    const pct = (n) => t.total ? `${Math.round(n / t.total * 1000) / 10}%` : "";
    $("cards").innerHTML = `<div class="card"><div class="label">총 기사</div><div class="num">${fmt(t.total)}<small>건</small></div><div class="pct">&nbsp;</div></div>` +
      KINDS.map(([k, label]) => `<div class="card"><div class="label"><span class="dot ${k}"></span>${label}</div>
        <div class="num">${fmt(t[k])}<small>건</small></div><div class="pct">${pct(t[k])}</div></div>`).join("");
    const p = s.period;
    $("period-info").textContent = t.total
      ? `${p.first_date} ~ ${p.last_date}의 기사` : "이 기간에는 기사가 없습니다.";

    $("by-year").innerHTML = table(s.by_year.map(x => ({ ...x, label: `${x.key}년` })), "년도", "기사가 없습니다.");
    const from = $("date-from").value || p.first_date, to = $("date-to").value || p.last_date;
    const months = fillMonths(s.by_month, from, to).map(x => ({ ...x, label: `${x.key.slice(0, 4)}년 ${Number(x.key.slice(5))}월` }));
    $("by-month").innerHTML = table(months, "월", "기사가 없습니다.");
    $("by-category").innerHTML = table(s.by_category, "분류", "기사가 없습니다.");
    $("by-press").innerHTML = table(s.by_press, "언론사", "기사가 없습니다.");
    $("press-count").textContent = s.by_press.length ? `${s.by_press.length}곳` : "";
    renderReleases(s.press_releases);
    renderSpecial(s.special);
  } catch (err) {
    $("error").innerHTML = `<div class="error">${esc(err.message)}</div>`;
  }
}

document.querySelectorAll("[data-legend]").forEach(el => {
  el.innerHTML = KINDS.map(([k, label]) => `<span><span class="dot ${k}"></span>${label}</span>`).join("");
});
$("preset").addEventListener("change", () => { applyPreset(); load(); });
for (const id of ["date-from", "date-to"]) $(id).addEventListener("change", () => { $("preset").value = "range"; load(); });
$("btn-refresh").addEventListener("click", load);
const periodBody = () => ({ date_from: $("date-from").value || null, date_to: $("date-to").value || null });
$("btn-xlsx-summary").addEventListener("click", (e) => downloadReleaseXlsx("summary", periodBody(), e.currentTarget));
$("btn-xlsx-articles").addEventListener("click", (e) => downloadReleaseXlsx("articles", periodBody(), e.currentTarget));
$("sp-filter").addEventListener("change", () => renderSpecial());
function specialExport(what) {
  const q = new URLSearchParams(Object.entries(periodBody()).filter(([, v]) => v));
  if ($("sp-filter").value) q.set("subtype", $("sp-filter").value);
  location.href = `/api/special/export/${what}?${q}`;
}
$("btn-xlsx-special-summary").addEventListener("click", () => specialExport("summary"));
$("btn-xlsx-special").addEventListener("click", () => specialExport("articles"));

applyPreset();
load();
// 창 모드: 이 창이 열려 있는 동안 서버에 연결을 붙잡아 둔다 (프로그램 창을 모두 닫으면 서버가 스스로 끝남)
function keepAlive(info) {
  if (!info || !info.window_mode || !window.EventSource) return;
  new EventSource("/api/alive");  // 이 탭이 열려 있는 동안 서버에 연결을 붙잡아 둔다
  const banner = () => document.getElementById("offline-banner") || document.body.insertAdjacentElement("afterbegin",
    Object.assign(document.createElement("div"), { id: "offline-banner",
      style: "position:fixed;top:0;left:0;right:0;z-index:99;background:#b91c1c;color:#fff;padding:10px 16px;text-align:center;font-weight:600",
      textContent: "프로그램이 꺼졌습니다. GoodMorningKOITA.vbs를 다시 실행한 뒤 이 탭을 새로 고침(F5)하세요." }));
  // 서버가 살아 있는지 10초마다 확인. 두 번 연속 응답이 없으면(절전에서 깨어나는 잠깐은 넘김) 안내를 띄운다
  let misses = 0;
  setInterval(() => {
    fetch("/healthz", { cache: "no-store" })
      .then(r => { if (!r.ok) throw 0; misses = 0; document.getElementById("offline-banner")?.remove(); })
      .catch(() => { if (++misses >= 2) banner(); });
  }, 10000);
}
api("/api/status").then(info => { keepAlive(info); $("version").textContent = `v${info.version}`; }).catch(() => {});
</script>
</body>

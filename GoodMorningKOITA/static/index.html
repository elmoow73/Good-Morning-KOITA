<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoodMorningKOITA</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6b7280; --line: #e3e6eb;
    --accent: #2457d6; --accent-soft: #e8eefc; --warn: #b45309; --warn-soft: #fef3c7;
    --red: #b91c1c; --green: #15803d; --green-soft: #dcfce7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 14px 24px;
           display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  #status { color: var(--muted); font-size: 13px; flex: 1; }
  main { max-width: 1280px; margin: 0 auto; padding: 20px 24px; display: grid; gap: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .panel h2 { font-size: 15px; margin: 0 0 12px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); border-radius: 6px;
           padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: wait; }
  input[type=text], input[type=date], select { font: inherit; border: 1px solid var(--line);
           border-radius: 6px; padding: 6px 10px; background: #fff; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line);
          border-radius: 999px; padding: 4px 6px 4px 12px; background: var(--accent-soft); }
  .chip.off { background: #f1f2f4; color: var(--muted); text-decoration: line-through; }
  .chip button { border: 0; background: transparent; padding: 0 4px; color: var(--muted); }
  .chip button:hover { color: var(--text); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  td.time { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
  td.press { white-space: nowrap; cursor: pointer; }
  td.press:hover { text-decoration: underline dotted; }
  td a { color: var(--text); text-decoration: none; font-weight: 600; }
  td a:hover { color: var(--accent); text-decoration: underline; }
  .desc { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; margin-right: 4px;
           cursor: pointer; white-space: nowrap; }
  .badge.online { background: #f1f2f4; color: var(--muted); }
  .badge.print { background: var(--warn-soft); color: var(--warn); }
  .badge.video { background: var(--green-soft); color: var(--green); }
  .kw { font-size: 12px; color: var(--muted); }
  .chip-or { color: var(--muted); font-size: 12px; align-self: center; }
  .badge.saved { background: var(--accent-soft); color: var(--accent); cursor: default; }
  th.check, td.check { width: 28px; padding-right: 0; }
  input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; }
  tr.checked td { background: #f5f8ff; }
  .del { color: var(--muted); border: 0; background: none; }
  .del:hover { color: var(--red); }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  .error { background: #fee2e2; color: var(--red); border-radius: 6px; padding: 8px 12px; margin-bottom: 12px;
           white-space: pre-wrap; }
  .count { color: var(--muted); font-weight: 400; }
  @media (max-width: 720px) {
    main, header { padding: 12px 16px; }
    .hide-sm { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>☀️ GoodMorningKOITA <small id="version" style="font-size:12px; color:var(--muted); font-weight:400"></small></h1>
  <span id="status">불러오는 중…</span>
  <div class="row">
    <select id="search-period" title="검색 기간">
      <option value="24">최근 24시간</option>
      <option value="48">최근 48시간</option>
      <option value="168">최근 7일</option>
      <option value="range">날짜 지정</option>
    </select>
    <span id="search-range" class="row" style="display:none">
      <input type="date" id="search-from"> ~ <input type="date" id="search-to">
    </span>
    <button id="btn-collect" class="primary">지금 다시 검색</button>
  </div>
  <div class="row">
    <button id="btn-export" title="체크한 기사만 엑셀로 내려받기">엑셀 다운로드</button>
    <button id="btn-archive" title="체크한 기사를 database 폴더의 DB 맨 아래에 추가 (이미 있는 기사는 건너뜀)">DB 저장</button>
    <span class="kw" id="archive-info"></span>
  </div>
</header>

<main>
  <section class="panel">
    <h2>검색 키워드 <span class="count">· 아래 키워드 중 하나라도 들어간 기사를 모두 모읍니다 (OR). 여러 키워드에 걸린 기사도 한 번만 보입니다.</span></h2>
    <div class="chips" id="keywords"></div>
    <form class="row" id="kw-form">
      <input type="text" id="kw-input" placeholder="새 키워드 (정확히 일치하려면 &quot;따옴표&quot;로 감싸기)" style="flex:1; min-width:220px">
      <button type="submit">추가</button>
    </form>
  </section>

  <section class="panel">
    <div class="row" style="justify-content: space-between; margin-bottom: 12px;">
      <h2 style="margin:0">기사 목록 <span class="count" id="count"></span></h2>
      <div class="row">
        <select id="period">
          <option value="24">최근 24시간</option>
          <option value="48">최근 48시간</option>
          <option value="168">최근 7일</option>
          <option value="range">날짜 지정</option>
        </select>
        <span id="range" class="row" style="display:none">
          <input type="date" id="date-from"> ~ <input type="date" id="date-to">
        </span>
        <select id="press-filter" title="언론사로 골라 보기"><option value="">언론사 전체</option></select>
        <select id="kw-filter" title="키워드로 골라 보기"><option value="">키워드 전체</option></select>
        <select id="sort" title="정렬">
          <option value="new">최신순</option>
          <option value="old">오래된순</option>
          <option value="press">언론사순</option>
          <option value="keyword">키워드순</option>
        </select>
        <input type="text" id="filter" placeholder="목록에서 찾기">
      </div>
    </div>
    <div id="errors"></div>
    <table>
      <thead><tr>
        <th class="check"><input type="checkbox" id="check-all" title="보이는 기사 모두 체크/해제"></th>
        <th>시간</th><th>언론사</th><th>구분</th><th>제목</th><th class="hide-sm">키워드</th><th></th>
      </tr></thead>
      <tbody id="articles"></tbody>
    </table>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let articles = [];
const checked = new Set();  // 체크한 기사 id

async function api(path, options = {}) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" }, ...options,
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  if (res.status === 401) { location.href = "/login"; throw new Error("로그인이 필요합니다."); }
  if (!res.ok) {
    const detail = await res.json().then(j => j.detail).catch(() => res.statusText);
    throw new Error(detail);
  }
  return res.json();
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function periodQuery(prefix = "") {
  const id = (name) => prefix ? `${prefix}-${name}` : (name === "period" ? "period" : `date-${name}`);
  const p = $(id("period")).value;
  if (p !== "range") return `hours=${p}`;
  const q = [];
  if ($(id("from")).value) q.push(`date_from=${$(id("from")).value}`);
  if ($(id("to")).value) q.push(`date_to=${$(id("to")).value}`);
  return q.join("&") || "hours=24";
}

// 검색한 기간과 같은 기간으로 기사 목록을 맞춘다
function syncListPeriod() {
  $("period").value = $("search-period").value;
  $("date-from").value = $("search-from").value;
  $("date-to").value = $("search-to").value;
  $("range").style.display = $("period").value === "range" ? "" : "none";
}

function fmtTime(iso) {
  const d = new Date(iso);
  const pad = (n) => String(n).padStart(2, "0");
  return `${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function showStatus(run) {
  if (!run) { $("status").textContent = "아직 수집 기록이 없습니다."; return; }
  $("status").textContent = `마지막 검색: ${fmtTime(run.finished_at)} · 새 기사 ${run.new_count}건`;
}

function showErrors(errors) {
  $("errors").innerHTML = errors && errors.length
    ? `<div class="error">${esc(errors.join("\n"))}</div>` : "";
}

// ---------------- 키워드 ----------------

function renderKeywords(list) {
  $("keywords").innerHTML = list.map((k, i) => `${i ? `<span class="chip-or">또는</span>` : ""}
    <span class="chip ${k.enabled ? "" : "off"}">
      <span>${esc(k.keyword)}</span>
      <button title="${k.enabled ? "검색에서 빼기" : "다시 검색에 포함"}" data-toggle="${k.id}" data-enabled="${k.enabled}">${k.enabled ? "⏸" : "▶"}</button>
      <button title="수정" data-edit="${k.id}" data-keyword="${esc(k.keyword)}">✎</button>
      <button title="삭제" data-delete="${k.id}">✕</button>
    </span>`).join("") || `<span class="kw">등록된 키워드가 없습니다.</span>`;
}

$("keywords").addEventListener("click", async (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  try {
    if (b.dataset.toggle) {
      renderKeywords(await api(`/api/keywords/${b.dataset.toggle}`, { method: "PATCH", body: { enabled: b.dataset.enabled !== "1" } }));
    } else if (b.dataset.edit) {
      const value = prompt("키워드 수정", b.dataset.keyword);
      if (value === null) return;
      renderKeywords(await api(`/api/keywords/${b.dataset.edit}`, { method: "PATCH", body: { keyword: value } }));
    } else if (b.dataset.delete) {
      if (!confirm("이 키워드를 삭제할까요?")) return;
      renderKeywords(await api(`/api/keywords/${b.dataset.delete}`, { method: "DELETE" }));
    }
  } catch (err) { alert(err.message); }
});

$("kw-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const value = $("kw-input").value.trim();
  if (!value) return;
  try {
    renderKeywords(await api("/api/keywords", { method: "POST", body: { keyword: value } }));
    $("kw-input").value = "";
  } catch (err) { alert(err.message); }
});

// ---------------- 기사 ----------------

// 기사의 키워드 칸("a", "b")을 따옴표 뺀 목록으로
function keywordsOf(a) {
  return (a.keywords || "").split(", ").map(k => k.replaceAll('"', "").trim()).filter(Boolean);
}

// 지금 목록에 있는 언론사·키워드로 선택 목록을 만든다 (많은 순, 건수 표시)
function fillFilterOptions() {
  const fill = (id, allLabel, values) => {
    const select = $(id);
    const current = select.value;
    const counts = new Map();
    for (const v of values) counts.set(v, (counts.get(v) || 0) + 1);
    const items = [...counts].sort((x, y) => y[1] - x[1] || x[0].localeCompare(y[0], "ko"));
    select.innerHTML = `<option value="">${allLabel}</option>` +
      items.map(([v, n]) => `<option value="${esc(v)}">${esc(v)} (${n})</option>`).join("");
    // 고른 값이 목록에서 사라졌으면 전체로
    select.value = counts.has(current) ? current : "";
  };
  fill("press-filter", "언론사 전체", articles.map(a => a.press || "?"));
  fill("kw-filter", "키워드 전체", articles.flatMap(keywordsOf));
}

function visibleArticles() {
  const term = $("filter").value.trim().toLowerCase();
  const press = $("press-filter").value;
  const keyword = $("kw-filter").value;
  const list = articles.filter(a =>
    (!term || `${a.title} ${a.press} ${a.description}`.toLowerCase().includes(term)) &&
    (!press || (a.press || "?") === press) &&
    (!keyword || keywordsOf(a).includes(keyword)));
  const byTime = (x, y) => y.published_at.localeCompare(x.published_at);
  const sorters = {
    new: byTime,
    old: (x, y) => -byTime(x, y),
    press: (x, y) => (x.press || "").localeCompare(y.press || "", "ko") || byTime(x, y),
    keyword: (x, y) => (keywordsOf(x)[0] || "").localeCompare(keywordsOf(y)[0] || "", "ko") || byTime(x, y),
  };
  return list.sort(sorters[$("sort").value]);
}

function renderSelection() {
  const list = visibleArticles();
  const n = checked.size;
  $("btn-export").textContent = n ? `엑셀 다운로드 (${n})` : "엑셀 다운로드";
  $("btn-archive").textContent = n ? `DB 저장 (${n})` : "DB 저장";
  const visibleChecked = list.filter(a => checked.has(a.id)).length;
  $("check-all").checked = list.length > 0 && visibleChecked === list.length;
  $("check-all").indeterminate = visibleChecked > 0 && visibleChecked < list.length;
}

function renderArticles() {
  const list = visibleArticles();
  $("count").textContent = `${list.length}건` + (checked.size ? ` · ${checked.size}건 체크` : "");
  $("articles").innerHTML = list.map(a => `
    <tr class="${checked.has(a.id) ? "checked" : ""}">
      <td class="check"><input type="checkbox" data-check="${a.id}" ${checked.has(a.id) ? "checked" : ""}></td>
      <td class="time">${fmtTime(a.published_at)}</td>
      <td class="press" data-press="${a.id}" title="클릭해서 언론사명 수정">${esc(a.press) || "?"}</td>
      <td>
        ${a.print_page !== "온라인"
          ? `<span class="badge print" data-print="${a.id}" title="클릭해서 지면 수정">지면 ${esc(a.print_page)}</span>`
          : `<span class="badge online" data-print="${a.id}" title="클릭해서 지면 입력">온라인</span>`}
        ${a.has_video ? `<span class="badge video" data-video="${a.id}" title="클릭해서 영상 표시 해제">영상</span>` : ""}
        ${a.archived ? `<span class="badge saved" title="DB에 이미 저장된 기사">저장됨</span>` : ""}
      </td>
      <td>
        <a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a>
        <div class="desc">${esc(a.description)}</div>
      </td>
      <td class="kw hide-sm">${esc(a.keywords)}</td>
      <td><button class="del" data-del="${a.id}" title="목록과 DB에서 삭제">✕</button></td>
    </tr>`).join("") || `<tr><td colspan="7" class="empty">해당 기간의 기사가 없습니다.</td></tr>`;
  renderSelection();
}

$("articles").addEventListener("change", (e) => {
  const id = Number(e.target.dataset.check);
  if (!id) return;
  e.target.checked ? checked.add(id) : checked.delete(id);
  renderArticles();
});

$("check-all").addEventListener("change", (e) => {
  for (const a of visibleArticles()) e.target.checked ? checked.add(a.id) : checked.delete(a.id);
  renderArticles();
});

$("articles").addEventListener("click", async (e) => {
  const t = e.target;
  const find = (id) => articles.find(a => a.id === Number(id));
  try {
    if (t.dataset.press) {
      const a = find(t.dataset.press);
      const value = prompt("언론사명", a.press);
      if (value === null) return;
      await api(`/api/articles/${a.id}`, { method: "PATCH", body: { press: value.trim() } });
      a.press = value.trim();
    } else if (t.dataset.print) {
      const a = find(t.dataset.print);
      const value = prompt("지면 (예: A12면). 비우면 온라인", a.print_page === "온라인" ? "" : a.print_page);
      if (value === null) return;
      const page = value.trim() || "온라인";
      await api(`/api/articles/${a.id}`, { method: "PATCH", body: { print_page: page } });
      a.print_page = page;
      if (page === "온라인" && !a.has_video && confirm("영상 기사로 표시할까요?")) {
        await api(`/api/articles/${a.id}`, { method: "PATCH", body: { has_video: true } });
        a.has_video = true;
      }
    } else if (t.dataset.video) {
      const a = find(t.dataset.video);
      if (!confirm("영상 표시를 해제할까요?")) return;
      await api(`/api/articles/${a.id}`, { method: "PATCH", body: { has_video: false } });
      a.has_video = false;
    } else if (t.dataset.del) {
      if (!confirm("이 기사를 삭제할까요? 다음 검색 때 다시 수집될 수 있습니다.")) return;
      await api(`/api/articles/${t.dataset.del}`, { method: "DELETE" });
      articles = articles.filter(a => a.id !== Number(t.dataset.del));
      checked.delete(Number(t.dataset.del));
    } else return;
    fillFilterOptions();  // 언론사명을 고치거나 기사를 지우면 선택 목록도 바뀐다
    renderArticles();
  } catch (err) { alert(err.message); }
});

async function loadArticles() {
  articles = await api(`/api/articles?${periodQuery()}`);
  // 기간을 바꿔 목록에서 사라진 기사는 체크도 푼다
  const ids = new Set(articles.map(a => a.id));
  for (const id of [...checked]) if (!ids.has(id)) checked.delete(id);
  fillFilterOptions();
  renderArticles();
}

async function collect(force) {
  const btn = $("btn-collect");
  btn.disabled = true;
  $("status").textContent = "네이버 뉴스 검색 중…";
  try {
    if ($("search-period").value === "range" && !$("search-from").value && !$("search-to").value) {
      throw new Error("검색할 날짜를 지정하세요.");
    }
    const result = await api(`/api/collect?force=${force}&${periodQuery("search")}`, { method: "POST" });
    syncListPeriod();
    showStatus(result.last_run);
    showErrors(result.errors);
  } catch (err) {
    showErrors([err.message]);
    $("status").textContent = "검색하지 못했습니다.";
  } finally {
    btn.disabled = false;
  }
  await loadArticles();
}

$("btn-collect").addEventListener("click", () => collect(true));
function checkedIds() {
  if (!checked.size) { alert("먼저 기사 앞의 칸을 체크하세요."); return null; }
  return [...checked];
}

function showArchiveInfo(info) {
  $("archive-info").textContent = `DB 누적 ${info.total}행`;
  $("archive-info").title = `저장 위치: ${info.folder}`;
}

$("btn-export").addEventListener("click", async () => {
  const ids = checkedIds();
  if (!ids) return;
  try {
    const res = await fetch("/api/export", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ids }),
    });
    if (!res.ok) throw new Error(await res.json().then(j => j.detail).catch(() => res.statusText));
    const name = decodeURIComponent((res.headers.get("Content-Disposition") || "").split("''")[1] || "뉴스.xlsx");
    const link = document.createElement("a");
    link.href = URL.createObjectURL(await res.blob());
    link.download = name;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(link.href), 10000);
  } catch (err) { alert(err.message); }
});

$("btn-archive").addEventListener("click", async () => {
  const ids = checkedIds();
  if (!ids) return;
  const btn = $("btn-archive");
  btn.disabled = true;
  try {
    const r = await api("/api/archive", { method: "POST", body: { ids } });
    showArchiveInfo((await api("/api/status")).archive);
    let message = `DB에 ${r.added}행을 추가했습니다.`;
    if (r.skipped) message += ` (이미 있던 ${r.skipped}행은 건너뜀)`;
    message += `\nDB 누적 ${r.total}행`;
    if (r.warnings.length) message += `\n\n${r.warnings.join("\n")}`;
    alert(message);
    checked.clear();
    await loadArticles();
  } catch (err) { alert(err.message); }
  finally { btn.disabled = false; }
});
$("search-period").addEventListener("change", () => {
  const isRange = $("search-period").value === "range";
  $("search-range").style.display = isRange ? "" : "none";
  if (isRange && !$("search-to").value) {
    const today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    $("search-to").value = today;
    $("search-from").value = today;
  }
});
$("period").addEventListener("change", () => {
  $("range").style.display = $("period").value === "range" ? "" : "none";
  loadArticles();
});
$("date-from").addEventListener("change", loadArticles);
$("date-to").addEventListener("change", loadArticles);
$("filter").addEventListener("input", renderArticles);
for (const id of ["press-filter", "kw-filter", "sort"]) $(id).addEventListener("change", renderArticles);

// 첫 화면: 키워드를 보여주고, 바로 최근 24시간 기사를 검색
(async () => {
  renderKeywords(await api("/api/keywords"));
  const info = await api("/api/status");
  $("version").textContent = `v${info.version}`;
  showArchiveInfo(info.archive);
  await collect(false);
})();
</script>
</body>
</html>
